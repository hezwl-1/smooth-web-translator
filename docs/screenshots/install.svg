<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560"><rect width="900" height="560" rx="28" fill="#0f172a"/><text x="450" y="82" font-size="40" font-family="Arial,Microsoft YaHei" text-anchor="middle" fill="white" font-weight="700">安装步骤</text><g font-size="24" fill="white"><rect x="105" y="130" width="690" height="64" rx="16" fill="#1e293b"/><text x="140" y="171" font-size="24" font-family="Arial,Microsoft YaHei" fill="white">1. 打开 chrome://extensions/ 或 edge://extensions/</text><rect x="105" y="215" width="690" height="64" rx="16" fill="#1e293b"/><text x="140" y="256" font-size="24" font-family="Arial,Microsoft YaHei" fill="white">2. 开启开发者模式</text><rect x="105" y="300" width="690" height="64" rx="16" fill="#1e293b"/><text x="140" y="341" font-size="24" font-family="Arial,Microsoft YaHei" fill="white">3. 点击加载已解压的扩展程序</text><rect x="105" y="385" width="690" height="64" rx="16" fill="#1e293b"/><text x="140" y="426" font-size="24" font-family="Arial,Microsoft YaHei" fill="white">4. 选择插件文件夹并开始使用</text></g><text x="450" y="505" font-size="22" font-family="Arial,Microsoft YaHei" text-anchor="middle" fill="#93c5fd">Smooth Web Translator by hez</text></svg>